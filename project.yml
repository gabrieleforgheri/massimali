name: Massimali
options:
  bundleIdPrefix: com.gabrieleforghieri
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Senza questo il progetto generato dichiara Xcode 14.3 e ogni apertura mostra il
# banner giallo "Update to recommended settings": cliccarlo non servirebbe, perché
# la generazione successiva riscriverebbe tutto da qui.
attributes:
  LastUpgradeCheck: "2660"
  LastSwiftUpdateCheck: "2660"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HKR6AKCLPA
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Qui e non nei target: app ed estensione devono avere la stessa versione.
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"

targets:
  Massimali:
    type: application
    platform: iOS
    sources:
      - path: Massimali
      - path: Shared
      - path: WatchShared
    dependencies:
      - target: MassimaliWidgets
    settings:
      base:
        PRODUCT_NAME: Massimali
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrieleforghieri.massimali
        INFOPLIST_FILE: Massimali/Info.plist
        CODE_SIGN_ENTITLEMENTS: Massimali/Massimali.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  # Live Activity dell'allenamento: schermata di blocco e Dynamic Island.
  MassimaliWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MassimaliWidgets
      - path: Shared
    info:
      path: MassimaliWidgets/Info.plist
      properties:
        CFBundleDisplayName: Massimali
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrieleforghieri.massimali.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO

  # App del Watch: conta le ripetizioni e rimanda le serie all'iPhone.
  # NON è dipendenza dell'app iPhone, quindi non finisce nell'ipa: AltStore non firma
  # le app Watch, questa si installa da Xcode direttamente sull'orologio. Il companion
  # è il bundle id che AltStore assegna all'app iPhone (con il team in coda).
  MassimaliWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MassimaliWatch
      - path: WatchShared
    info:
      path: MassimaliWatch/Info.plist
      properties:
        CFBundleDisplayName: Massimali
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.gabrieleforghieri.massimali.HKR6AKCLPA
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Per tenere attivo il conteggio delle ripetizioni durante la serie.
        NSHealthUpdateUsageDescription: Per tenere attivo il conteggio delle ripetizioni durante la serie. L'allenamento in Salute lo registra l'iPhone.
        NSMotionUsageDescription: Per contare le ripetizioni dal movimento del polso.
    entitlements:
      path: MassimaliWatch/MassimaliWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_NAME: Massimali
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrieleforghieri.massimali.HKR6AKCLPA.watchkitapp
        GENERATE_INFOPLIST_FILE: NO

  MassimaliTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MassimaliTests
    dependencies:
      - target: Massimali
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrieleforghieri.massimali.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MassimaliWatch:
    build:
      targets:
        MassimaliWatch: all
    run:
      config: Debug
  Massimali:
    build:
      targets:
        Massimali: all
        MassimaliTests: [test]
    run:
      config: Debug
      # La console di Xcode è invasa da messaggi dei servizi di sistema di iOS
      # ("cannot add handler to 0 from 0", PointerUI…): non arrivano dall'app, che
      # non scrive un solo log. Questa variabile li silenzia. Per rivederli tutti,
      # basta toglierla e rigenerare.
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    test:
      config: Debug
      targets:
        - MassimaliTests
